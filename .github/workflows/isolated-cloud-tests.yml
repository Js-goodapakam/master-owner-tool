name: Owner Tool — Isolated Cloud Verification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/isolated-cloud-tests.yml'
      - 'Server/**'
      - 'Database/migrations/**'
      - 'docs/implementation/P0-P1-STATUS.md'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/isolated-cloud-tests.yml'
      - 'Server/**'
      - 'Database/migrations/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  owner-api-isolated:
    name: Owner API + real disposable PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: engage_owner_test
          POSTGRES_USER: engage_owner_test
          POSTGRES_PASSWORD: disposable_runner_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engage_owner_test -d engage_owner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      CI: 'true'
      OWNER_TEST_DATABASE_ID: engage-owner-test-github-actions
      OWNER_TEST_DATABASE_URL: postgresql://engage_owner_test:disposable_runner_only@127.0.0.1:5432/engage_owner_test?sslmode=disable
      # Deliberately no DATABASE_URL, Supabase or Vercel secrets.
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run fail-closed database safety guard tests
        run: node --test Server/scripts/assert-isolated-owner-db.test.mjs

      - name: Verify actual connected PostgreSQL 16 identity before migrations
        run: node Server/scripts/verify-isolated-owner-db.mjs

      - name: Apply Owner SQL migrations to disposable PostgreSQL
        run: node Server/scripts/setup-isolated-owner-db.mjs

      - name: Run existing Owner API unit and in-process Express integration suites
        run: npm run test -w @friday/api

      - name: Run real PostgreSQL onboarding, lifecycle and provisioning tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:postgres -w @friday/api | tee owner-postgres-tests.log

      - name: Build backend and verify TypeScript
        run: |
          npm run build -w @friday/shared
          npm run build -w @friday/api

      - name: Summarize verification boundaries
        if: always()
        shell: bash
        run: |
          {
            echo "## Owner Tool - isolated PostgreSQL 16"
            echo "Real database: local ephemeral engage_owner_test; Supabase credentials not injected."
            echo "Schema: Database/migrations/001-011 including additive active-subscription uniqueness."
            if [[ -f owner-postgres-tests.log ]]; then
              echo "### Real PostgreSQL suite"
              grep -E 'Test Files|Tests  ' owner-postgres-tests.log || true
            else
              echo "PostgreSQL integration suite did not start; do not claim acceptance."
            fi
            echo "### Verification boundaries"
            echo "Existing Owner Express API tests use in-memory/synthetic HTTP adapters."
            echo "PostgreSQL tests execute real SQL against repository tables and the real injected-clock expiry evaluator."
            echo "Supabase Auth, PostgREST, Storage, RLS as non-owner, external EngageStay provisioning and production smoke tests NOT exercised."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PostgreSQL test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-postgres-integration-log
          path: owner-postgres-tests.log
          if-no-files-found: ignore
