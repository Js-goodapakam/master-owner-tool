name: Friday Owner CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Friday Owner
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: owner_test
          POSTGRES_PASSWORD: owner_test
          POSTGRES_DB: owner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner_test -d owner_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://owner_test:owner_test@localhost:5432/owner_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build all workspaces
        run: npm run build
      - name: Lint all workspaces
        run: npm run lint
      - name: Run backend tests
        run: npm test
      - name: Apply isolated database migrations
        run: npm run db:migrate
