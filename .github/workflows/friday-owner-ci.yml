name: Friday Owner CI

on:
  push:
    branches:
      - main
      - codex/p0-05b-checkout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Friday Owner
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: owner_test
          POSTGRES_PASSWORD: owner_test
          POSTGRES_DB: owner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner_test -d owner_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://owner_test:owner_test@127.0.0.1:5432/owner_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build all workspaces
        run: npm run build
      - name: Lint all workspaces
        run: npm run lint
      - name: Validate hosted staging targets without network access
        run: node --test scripts/check-hosted-staging.test.mjs
      - name: Run backend tests
        run: npm test
      - name: Apply isolated database migrations
        run: npm run db:migrate
      - name: Exercise verified capture in disposable PostgreSQL
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f Database/tests/verified-payment.sql
      - name: Check out compatible Engage Stay receiver
        uses: actions/checkout@v4
        with:
          repository: Js-goodapakam/friday-desk-server
          ref: 5be8d0e3851630538641522ed08ac2ff14288377
          path: engage-stay
      - name: Prepare and test disposable Engage Stay database
        if: github.ref == 'refs/heads/codex/p0-05b-checkout'
        env:
          ENGAGE_TEST_DATABASE_ID: engage-stay-test-ci
          ENGAGE_TEST_DATABASE_URL: postgresql://owner_test:owner_test@127.0.0.1:5432/engage_stay_test?sslmode=disable
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database engage_stay_test'
          npm ci --ignore-scripts --prefix engage-stay
          node engage-stay/scripts/setup-isolated-postgres.js
          node --test engage-stay/src/postgres-acceptance.test.js
          npx --no-install tsx Server/src/db/subscription-http.acceptance.ts
          ENGAGE_TEST_DATABASE_URL= ENGAGE_TEST_DATABASE_ID= npm test --prefix engage-stay

      - name: Rehearse historical Owner upgrade and backup restoration
        if: github.ref == 'refs/heads/codex/p0-05b-checkout'
        run: bash Database/tests/upgrade-restore.sh
      - name: Check out pinned Stay staging frontend
        if: github.ref == 'refs/heads/codex/p0-05b-checkout'
        uses: actions/checkout@v4
        with:
          repository: Js-goodapakam/friday-desk-client
          ref: 5e04f5d82eaefc30224726d22a1d8c0cebd39d5e
          path: engage-stay-client
      - name: Verify and build Stay routing artifact
        if: github.ref == 'refs/heads/codex/p0-05b-checkout'
        working-directory: engage-stay-client
        env:
          STAY_STAGING_API_ORIGIN: https://engage-stay-staging.vercel.app
        run: |
          npm ci
          node --test src/core/*.test.js scripts/staging-routing.test.mjs
          npm run build
          node scripts/staging-routing.mjs "$RUNNER_TEMP/stay-staging-artifact"

  local-supabase:
    if: github.ref == 'refs/heads/codex/p0-05b-checkout'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - uses: actions/checkout@v4
        with:
          repository: Js-goodapakam/friday-desk-server
          ref: 5be8d0e3851630538641522ed08ac2ff14288377
          path: engage-stay
      - uses: actions/checkout@v4
        with:
          repository: Js-goodapakam/friday-desk-client
          ref: 5e04f5d82eaefc30224726d22a1d8c0cebd39d5e
          path: engage-stay-client
      - run: npm ci && npm run build -w @friday/shared && npm run build -w @friday/web && npm ci --ignore-scripts --prefix engage-stay
      - name: Install isolated browser and build Stay frontend
        run: |
          npm ci --prefix engage-stay-client
          npm run build --prefix engage-stay-client
          npm install --prefix "$RUNNER_TEMP/pms-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/pms-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Initialize isolated stack and probe real services
        run: |
          set -euo pipefail
          local_stack="$(mktemp -d)"
          cd "$local_stack"
          supabase init
          sed -i '/^\[auth.email\]/,/^\[/ s/^enable_confirmations = false/enable_confirmations = true/' supabase/config.toml
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT
          if ! supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor >/tmp/local-supabase-start.log 2>&1; then
            echo 'Local Supabase failed to start'
            grep -Ei 'error|not found|unhealthy' /tmp/local-supabase-start.log | cut -c1-180 || true
            exit 1
          fi
          PMS_BROWSER_ROOT="$RUNNER_TEMP/pms-browser" node --import "$GITHUB_WORKSPACE/node_modules/tsx/dist/loader.mjs" "$GITHUB_WORKSPACE/scripts/local-supabase-acceptance.mjs" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/engage-stay" "$GITHUB_WORKSPACE/engage-stay-client"
