name: Friday Owner CI

on:
  push:
    branches:
      - main
      - codex/p0-05b-checkout
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Friday Owner
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: owner_test
          POSTGRES_PASSWORD: owner_test
          POSTGRES_DB: owner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner_test -d owner_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://owner_test:owner_test@127.0.0.1:5432/owner_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build all workspaces
        run: npm run build
      - name: Lint all workspaces
        run: npm run lint
      - name: Run backend tests
        run: npm test
      - name: Apply isolated database migrations
        run: npm run db:migrate
      - name: Exercise verified capture in disposable PostgreSQL
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f Database/tests/verified-payment.sql
      - name: Check out compatible Engage Stay receiver
        uses: actions/checkout@v4
        with:
          repository: Js-goodapakam/friday-desk-server
          ref: e366593a4d7b3d77f09e4710d57866a3f832220c
          path: engage-stay
      - name: Prepare and test disposable Engage Stay database
        if: github.ref == 'refs/heads/codex/p0-05b-checkout'
        env:
          ENGAGE_TEST_DATABASE_ID: engage-stay-test-ci
          ENGAGE_TEST_DATABASE_URL: postgresql://owner_test:owner_test@127.0.0.1:5432/engage_stay_test?sslmode=disable
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database engage_stay_test'
          npm ci --ignore-scripts --prefix engage-stay
          node engage-stay/scripts/setup-isolated-postgres.js
          node --test engage-stay/src/postgres-acceptance.test.js
          npx --no-install tsx Server/src/db/subscription-http.acceptance.ts
          ENGAGE_TEST_DATABASE_URL= ENGAGE_TEST_DATABASE_ID= npm test --prefix engage-stay
